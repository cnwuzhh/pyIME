patch:
  style/color_scheme: pyime_light
  style/font_face: Microsoft YaHei
  style/label_font_face: Microsoft YaHei
  style/comment_font_face: Microsoft YaHei
  style/font_point: 14
  style/label_font_point: 14
  style/comment_font_point: 12
  style/horizontal: true
  style/fullscreen: false
  style/vertical_text: false
  style/inline_preedit: false
  style/preedit_type: composition
  style/label_format: "%s."
  style/ascii_tip_follow_cursor: true
  style/display_tray_icon: true
  style/layout/min_width: 0
  style/layout/border_width: 1
  style/layout/margin_x: 12
  style/layout/margin_y: 8
  style/layout/spacing: 10
  style/layout/candidate_spacing: 18
  style/layout/hilite_spacing: 5
  style/layout/hilite_padding: 4
  style/layout/round_corner: 4
  style/layout/corner_radius: 8
  style/layout/shadow_radius: 0
  preset_color_schemes/pyime_light:
    name: pyIME Light
    author: pyIME
    color_format: argb
    back_color: 0xFFFFFFFF
    border_color: 0xFFE5E7EB
    text_color: 0xFF333333
    hilited_text_color: 0xFF333333
    hilited_back_color: 0xFFFFFFFF
    candidate_text_color: 0xFF333333
    candidate_back_color: 0xFFFFFFFF
    label_color: 0xFF777777
    comment_text_color: 0xFF888888
    hilited_candidate_back_color: 0xFF0078D7
    hilited_candidate_text_color: 0xFFFFFFFF
    hilited_label_color: 0xFFFFFFFF
    hilited_comment_text_color: 0xFFFFFFFF
